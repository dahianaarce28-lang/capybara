<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Capybaras 🐾</title>
    <link rel="stylesheet" href="css.css">
    <!-- SDK de Supabase desde CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>🦫 Registro de Capybaras</h1>
            <p>Monitorea y registra a los roedores más tranquilos del mundo.</p>
        </header>

        <main>
            <!-- Formulario de Registro -->
            <section class="card form-card">
                <h2>Registrar Nueva Capybara</h2>
                <form id="capybara-form">
                    <div class="form-group">
                        <label for="nombre">Nombre:</label>
                        <input type="text" id="nombre" required placeholder="Ej. Don Pancho">
                    </div>
                    <div class="form-group">
                        <label for="edad">Edad (años):</label>
                        <input type="number" id="edad" required min="0" placeholder="Ej. 3">
                    </div>
                    <div class="form-group">
                        <label for="peso">Peso (kg):</label>
                        <input type="number" step="0.1" id="peso" required min="0" placeholder="Ej. 45.5">
                    </div>
                    <div class="form-group">
                        <label for="lugar">Lugar de Avistamiento / Hábitat:</label>
                        <input type="text" id="lugar" required placeholder="Ej. Río Paraguay">
                    </div>
                    <button type="submit" id="submit-btn">Guardar Capybara</button>
                </form>
            </section>

            <!-- Listado de Capybaras -->
            <section class="card list-card">
                <h2>Capybaras Registradas</h2>
                <div id="loading" class="spinner">Cargando capybaras...</div>
                <div id="capybaras-list" class="grid"></div>
            </section>
        </main>
    </div>

    <script src="java.js"></script>
</body>
</html>
